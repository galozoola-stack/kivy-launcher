name: Android APK (p4a)

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "buildozer.spec"
      - ".github/workflows/android-p4a.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [armeabi-v7a, arm64-v8a]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
      - name: Install p4a
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install python-for-android cython
      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          p4a apk \
            --private . \
            --package org.example.kivycodeeditor \
            --name "Kivy Code Editor" \
            --version 0.1 \
            --bootstrap sdl2 \
            --requirements python3,kivy \
            --orientation portrait \
            --arch ${{ matrix.arch }} \
            --android-api 35 \
            --storage-dir .p4a
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kivy-code-editor-${{ matrix.arch }}
          path: bin/*.apk
          if-no-files-found: error
          
